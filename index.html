<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="보따리 앱의 개인정보 처리방침과 지원 안내입니다.">
    <title>보따리 · 안내</title>
    <style>
      :root { color-scheme: light; --ink: #28251f; --muted: #706b62; --brown: #7a6648; --paper: #f7f6f2; --line: #e8e4dc; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 52px; }
      .mark { color: var(--brown); font-size: 14px; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 18px 0 8px; font-size: clamp(30px, 7vw, 42px); line-height: 1.25; letter-spacing: -.04em; }
      .intro { margin: 0; color: var(--muted); }
      nav { display: grid; gap: 12px; margin-top: 36px; }
      nav a { display: block; padding: 20px 22px; border: 1px solid var(--line); border-radius: 18px; background: #fff; color: var(--ink); text-decoration: none; }
      nav a:hover, nav a:focus-visible { border-color: var(--brown); outline: none; }
      nav strong { display: block; font-size: 18px; }
      nav span { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; }
      .contact { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
      a { color: var(--brown); }
      .english { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
      footer { margin-top: 34px; color: var(--muted); font-size: 13px; }
      @media (prefers-reduced-motion: no-preference) { nav a { transition: border-color .15s ease; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">BOTTARI</div>
      <h1>보따리 안내</h1>
      <p class="intro">보따리 앱의 개인정보 처리방침과 지원 정보를 확인할 수 있어요.</p>

      <nav aria-label="안내 페이지">
        <a href="privacy.html">
          <strong>개인정보 처리방침</strong>
          <span>저장되는 정보와 앱의 데이터 처리 방법</span>
        </a>
        <a href="support.html">
          <strong>지원</strong>
          <span>문제가 있거나 도움이 필요할 때</span>
        </a>
      </nav>

      <p class="contact">문의: <a href="mailto:bottari.support@gmail.com">bottari.support@gmail.com</a></p>

      <p class="english" lang="en">English summary: This site provides Bottari’s privacy policy and support information. For help, contact <a href="mailto:bottari.support@gmail.com">bottari.support@gmail.com</a>.</p>
      <footer>보따리</footer>
    </main>
  </body>
</html>
